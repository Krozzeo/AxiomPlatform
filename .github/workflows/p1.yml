name: Platform acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
        timeout-minutes: 3

  real-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: platform
      - uses: actions/checkout@v4
        with:
          repository: Krozzeo/AxiomGameEngine
          ref: 1d31a70b7d26bc1891ff45cc609e5bc6f813dfd9
          path: game-engine
      - uses: actions/checkout@v4
        with:
          repository: Krozzeo/AxiomMathLab
          ref: f913fe79f8aad1281d79e4a290f66a0a17fbb5b5
          path: math-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.90.0
      - run: npm ci
        working-directory: game-engine
      - run: npm run build
        working-directory: game-engine
      - run: npx playwright install --with-deps chromium
        working-directory: game-engine
      - run: npm ci --no-audit --no-fund
        working-directory: math-lab
      - run: npm run check
        timeout-minutes: 3
        working-directory: math-lab
      - run: npm run check
        timeout-minutes: 3
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:p2
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:p3
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:p4
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:p5
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:mvp
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:products
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:installations
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:providers
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - run: npm run test:browser:discovery
        env:
          AXIOM_ENGINE_PATH: ../game-engine
      - run: npm run test:browser:demos
        env:
          AXIOM_ENGINE_PATH: ../game-engine
          AXIOM_MATH_PATH: ../math-lab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-browser-evidence
          path: |
            platform/.axiom/p1-browser
            platform/.axiom/p2-browser
            platform/.axiom/p3-browser
            platform/.axiom/p4-browser
            platform/.axiom/p5-browser
            platform/.axiom/products-browser
            platform/.axiom/mvp-browser
            platform/.axiom/installations-browser
            platform/.axiom/providers-jobs-browser
            platform/.axiom/release-discovery-browser
            platform/.axiom/demos-browser
          include-hidden-files: true
